/* NORBLE — token landing page. Deep navy-black base, gold accent,
   rounded cards, centered hero. Headlines: system-ui bold. Data, streams
   and labels: monospace. Motion stays functional: typing, ticking numbers,
   breathing dots, blinking cursor. Zero external dependencies. */

:root {
  --bg: #0b0e13;
  --bg-card: #12161d;
  --bg-inset: #0d1117;
  --line: #1e242e;
  --line-soft: #171c24;
  --gold: #f0b232;
  --gold-deep: #e8a51f;
  --gold-dim: #8a6a1e;
  --red: #ff4d45;
  --green: #3fce6b;
  --text: #f2f4f8;
  --text-dim: #9aa3b2;
  --text-faint: #5b6472;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --radius: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { min-width: 1100px; scroll-behavior: smooth; }

body {
  background:
    linear-gradient(rgba(11, 14, 19, .86), rgba(11, 14, 19, .86)),
    url("bg-neon.jpg") center / cover no-repeat fixed,
    var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
}

::selection { background: var(--gold); color: #000; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #232a36; border: 2px solid var(--bg); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold-dim); }

a { color: var(--gold); text-decoration: none; }
a:hover { color: var(--gold-deep); }

/* ============================== buttons ================================ */
.btn {
  display: inline-block;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: .2px;
  padding: 13px 28px;
  border-radius: 999px;
  cursor: pointer;
  border: 1px solid transparent;
  transition: transform .12s ease, background .15s ease, border-color .15s ease;
  text-decoration: none;
  white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn-gold {
  background: linear-gradient(180deg, var(--gold), var(--gold-deep));
  color: #14100a;
}
.btn-gold:hover { background: linear-gradient(180deg, #ffc44d, var(--gold)); color: #14100a; }
.btn-ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--text);
}
.btn-ghost:hover { border-color: var(--gold-dim); color: var(--gold); }

/* ============================== dots =================================== */
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
  animation: breathe 2.4s ease-in-out infinite;
}
.dot-ok   { background: var(--green); box-shadow: 0 0 7px rgba(63, 206, 107, .7); }
.dot-bad  { background: var(--red);   box-shadow: 0 0 9px rgba(255, 77, 69, .85); animation-duration: 1.1s; }
.dot-live { background: var(--gold);  box-shadow: 0 0 7px rgba(240, 178, 50, .7); }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

/* ============================== cards ================================== */
.card {
  background: rgba(18, 22, 29, .82);
  backdrop-filter: blur(6px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px 28px;
}
.card-label {
  display: flex;
  align-items: center;
  gap: 9px;
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 3px;
  color: var(--text-faint);
  border-bottom: 1px solid var(--line-soft);
  padding-bottom: 14px;
  margin-bottom: 4px;
}

/* ============================== nav ==================================== */
.nav {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 32px;
  background: rgba(11, 14, 19, .88);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-soft);
}
.nav-brand { display: flex; align-items: center; gap: 11px; }
.nav-logo { width: 30px; height: 30px; object-fit: contain; }
.nav-name { font-weight: 800; font-size: 16px; letter-spacing: 2.5px; color: var(--text); }
.nav-links { display: flex; gap: 30px; }
.nav-links a {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 2.5px;
  color: var(--text-dim);
}
.nav-links a:hover { color: var(--gold); text-decoration: none; }
.btn-nav { padding: 9px 22px; font-size: 13px; }
.nav-socials { display: flex; gap: 10px; }

/* ============================== hero =================================== */
.hero {
  max-width: 860px;
  margin: 0 auto;
  padding: 84px 24px 72px;
  text-align: center;
}
.hero-badge {
  position: relative;
  width: 200px;
  height: 200px;
  margin: 0 auto 34px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.hero-badge::before {
  content: "";
  position: absolute;
  inset: -55px;
  background: radial-gradient(circle, rgba(240, 178, 50, .28) 0%, rgba(240, 178, 50, .08) 42%, transparent 68%);
  border-radius: 50%;
}
.hero-logo {
  position: relative;
  width: 200px;
  height: 200px;
  object-fit: contain;
}
.hero-brand {
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 4px;
  color: var(--text);
  margin-bottom: 22px;
}
.pill {
  display: inline-block;
  vertical-align: 2px;
  margin-left: 12px;
  font-family: var(--mono);
  font-weight: 400;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--gold);
  border: 1px solid var(--gold-dim);
  border-radius: 999px;
  padding: 4px 14px;
}
.hero-title {
  font-weight: 800;
  font-size: clamp(40px, 5.4vw, 66px);
  line-height: 1.08;
  letter-spacing: -.025em;
  color: var(--text);
  margin-bottom: 26px;
}
.gold { color: var(--gold); }
.hero-sub {
  color: var(--text-dim);
  font-size: 16px;
  line-height: 1.7;
  max-width: 62ch;
  margin: 0 auto 36px;
}
.hero-cta { display: flex; justify-content: center; gap: 14px; margin-bottom: 34px; }
.hero-status {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-dim);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 8px 20px;
  background: var(--bg-inset);
}
.hero-status.unstable { border-color: #4a1c18; color: var(--red); }
.hero-status.unstable #containmentText { color: var(--red); }
#containmentText { color: var(--text); }
.hero-status.unstable #containmentText { color: var(--red); }
#genChip { color: var(--gold); }
.hero-status-sep { color: var(--text-faint); }

/* ============================== feature cards ========================== */
.features {
  max-width: 1150px;
  margin: 0 auto;
  padding: 24px 24px 8px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
}
.feature-card h3 {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 1.5px;
  color: var(--text);
  margin: 16px 0 10px;
}
.feature-card p { color: var(--text-dim); font-size: 13.5px; line-height: 1.7; }
.feature-icon {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  color: var(--gold);
  background: rgba(240, 178, 50, .1);
  border: 1px solid rgba(240, 178, 50, .25);
}

/* ============================== sections =============================== */
.section {
  max-width: 1150px;
  margin: 0 auto;
  padding: 80px 24px 0;
}
.section-head { text-align: center; margin-bottom: 40px; }
.section-title {
  font-weight: 800;
  font-size: clamp(30px, 3.6vw, 44px);
  letter-spacing: -.02em;
  color: var(--text);
}
.section-note {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-faint);
  margin-top: 10px;
}

/* ============================== live =================================== */
.live-grid {
  display: grid;
  grid-template-columns: 7fr 4fr;
  gap: 18px;
}
.stream {
  height: 430px;
  overflow-y: auto;
  padding: 8px 2px;
  font-family: var(--mono);
  border-bottom: 1px solid var(--line-soft);
}
.stream-line {
  display: flex;
  gap: 12px;
  align-items: baseline;
  padding: 5px 0;
  border-bottom: 1px solid var(--line-soft);
}
.stream-line:last-child { border-bottom: none; }
.stream-ts { color: var(--text-faint); font-size: 10.5px; white-space: nowrap; }
.stream-tag { font-size: 9.5px; letter-spacing: 1.5px; white-space: nowrap; color: var(--text-faint); }
.stream-tag.t-note { color: var(--gold); }
.stream-tag.t-sys  { color: var(--text-faint); }
.stream-text { color: var(--text-dim); font-size: 13px; word-break: break-word; }
.stream-line.is-note .stream-text { color: #ead9ac; }
.stream-line.is-note .stream-text em { color: var(--gold); font-style: normal; }
.stream-line.is-react .stream-text { color: var(--text-faint); }
.stream-prompt {
  padding-top: 14px;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--green);
}
.cursor { animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* telemetry */
.tele-big { display: flex; align-items: baseline; gap: 14px; margin: 20px 0 12px; }
.tele-big-value {
  font-weight: 800;
  font-size: 78px;
  line-height: 1;
  letter-spacing: -.03em;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}
.tele-big-value.warn { color: var(--red); }
.tele-unit { font-size: 26px; font-weight: 700; color: var(--gold-dim); margin-left: 4px; }
.tele-big-value.warn .tele-unit { color: var(--red); }
.tele-big-label {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 3px;
  color: var(--text-faint);
}
.tele-bar {
  height: 4px;
  background: var(--line-soft);
  border-radius: 2px;
  margin-bottom: 24px;
  overflow: hidden;
}
.tele-bar-fill {
  height: 100%;
  width: 60%;
  background: var(--gold);
  border-radius: 2px;
  transition: width .8s ease, background .8s ease;
}
.tele-bar-fill.warn { background: var(--red); }
.tele-list { display: flex; flex-direction: column; font-family: var(--mono); }
.tele-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--line-soft);
}
.tele-row dt { font-size: 10px; letter-spacing: 2.5px; color: var(--text-faint); }
.tele-row dd { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
.tele-note {
  margin-top: 22px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.7;
  color: var(--text-faint);
}

/* ============================== letters ================================ */
.letters-card { max-width: 860px; margin: 0 auto; }
.letters-blurb {
  color: var(--text-dim);
  font-size: 15px;
  line-height: 1.7;
  margin-bottom: 26px;
  max-width: 62ch;
}
.note-form { display: flex; align-items: center; gap: 10px; font-family: var(--mono); }
.note-prompt { color: var(--green); font-weight: 700; }
.note-form input {
  background: var(--bg-inset);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  padding: 11px 14px;
  outline: none;
}
.note-form input:focus { border-color: var(--gold-dim); }
#noteName { width: 220px; }
#noteText { flex: 1; min-width: 200px; }
.note-form .btn { font-family: var(--sans); padding: 11px 22px; font-size: 13px; }
.note-result {
  margin-top: 12px;
  min-height: 18px;
  color: var(--gold-dim);
  font-family: var(--mono);
  font-size: 12px;
}

/* ============================== files ================================== */
.files-card { padding: 30px 34px 40px; }
.file-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 44px;
}
.file-tab {
  background: var(--bg-inset);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--text-dim);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 1.5px;
  padding: 9px 18px;
  cursor: pointer;
  transition: border-color .15s ease, color .15s ease;
}
.file-tab:hover { color: var(--text); border-color: var(--gold-dim); }
.file-tab.active {
  color: var(--gold);
  border-color: var(--gold-dim);
  background: rgba(240, 178, 50, .08);
}

.file-body { display: none; max-width: 720px; }
.file-body.active { display: block; }

.file-title {
  font-weight: 800;
  font-size: clamp(28px, 3vw, 38px);
  letter-spacing: -.02em;
  color: var(--text);
  margin-bottom: 18px;
}
.file-lede {
  font-size: 17px;
  line-height: 1.65;
  color: #c8cfd9;
  margin: 0 0 26px;
}
.file-lede strong { color: var(--text); }
.file-meta {
  font-family: var(--mono);
  font-size: 10.5px !important;
  letter-spacing: 1.5px;
  color: var(--text-faint) !important;
  margin-bottom: 26px !important;
}
.file-body h4 {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 3px;
  color: var(--gold-dim);
  margin: 40px 0 14px;
  border-top: 1px solid var(--line-soft);
  padding-top: 18px;
}
.file-body p { margin: 12px 0; color: var(--text-dim); font-size: 14px; }
.file-body p strong, .file-body li strong { color: var(--text); }
.file-body em { color: var(--gold); font-style: italic; }
.file-body ul { margin: 12px 0 12px 20px; color: var(--text-dim); font-size: 14px; }
.file-body li { margin: 5px 0; }
.checklist { list-style: none; margin-left: 0 !important; font-family: var(--mono); font-size: 13px !important; }

.file-body blockquote {
  font-weight: 650;
  font-size: clamp(19px, 2vw, 24px);
  line-height: 1.4;
  letter-spacing: -.01em;
  color: var(--text);
  margin: 40px 0;
  padding-left: 22px;
  border-left: 3px solid var(--gold);
}
.file-body blockquote cite {
  display: block;
  font-family: var(--mono);
  font-style: normal;
  font-weight: 400;
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--text-faint);
  margin-top: 12px;
}
.file-body blockquote.verse { color: var(--gold); font-size: clamp(17px, 1.8vw, 22px); }
.file-stamp {
  font-family: var(--mono);
  color: var(--red) !important;
  letter-spacing: 2px;
  font-size: 11px !important;
  border: 1px solid #4a1c18;
  border-radius: 8px;
  display: inline-block;
  padding: 5px 12px;
  margin-top: 14px !important;
}

.file-body pre.ascii, .file-body pre.log {
  font-family: var(--mono);
  background: var(--bg-inset);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 20px;
  margin: 18px 0 26px;
  overflow-x: auto;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--text-dim);
}
.file-body pre.ascii { color: var(--gold-dim); }
.log .la { color: #ead9ac; }
.log .lb { color: var(--text); }
.log .lg { color: var(--gold-dim); }
.log .ls { color: var(--text-faint); font-style: italic; }

table.poll { border-collapse: collapse; margin: 16px 0; font-family: var(--mono); }
table.poll td {
  border: 1px solid var(--line);
  padding: 7px 16px;
  color: var(--text-dim);
  font-size: 12.5px;
}
table.poll td:first-child { color: var(--text-faint); letter-spacing: 1px; }

/* ============================== footer ================================= */
.footer {
  max-width: 1150px;
  margin: 90px auto 0;
  padding: 44px 24px 64px;
  border-top: 1px solid var(--line-soft);
  text-align: center;
}
.footer-disclaimer {
  color: var(--text-faint);
  font-size: 12.5px;
  max-width: 72ch;
  margin: 0 auto 20px;
}
.footer-links {
  display: flex;
  justify-content: center;
  gap: 30px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 2.5px;
}
.footer-sig {
  font-family: var(--mono);
  color: var(--text-faint);
